image_size: 224
batch_size: 64
val_frac: 0.1
pretrained_epochs: 40
scratch_epochs: 150
early_stop_patience: 8
lr: 0.0003
warmup_epochs: 3
weight_decay: 0.05
num_workers: 8          # kuota cgroup pod = 10 vCPU, sisakan 2 untuk proses utama
amp: true
prefetch_factor: 2      # 2 loader x 8 worker x 2 = 1,2 GB shm (tersedia 15 GB)
