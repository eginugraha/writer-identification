image_size: 224
batch_size: 64
val_frac: 0.1
pretrained_epochs: 40
scratch_epochs: 150
early_stop_patience: 8
lr: 0.0003
warmup_epochs: 3
weight_decay: 0.05
num_workers: 10         # 12 vCPU - 2 (RTX PRO 4000); sesuaikan bila pod berubah
amp: true
prefetch_factor: 2      # 31GB RAM: 2 loader x 10 worker x 2 = 1,5 GB shm
